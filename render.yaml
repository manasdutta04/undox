# Free Render web service — dashboard + fixtures + MCP (one Docker process).
# Session store is ephemeral on free tier; deploy/seed-sessions.json is baked into the image
# so judges always see demo-test-2 after cold start / redeploy.
services:
  - type: web
    name: undox-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: UNDOX_SESSION_STORE
        value: /data/.undox-session-state.json
      - key: UNDOX_MCP_TOKEN
        generateValue: true
      # UNDOX_PUBLIC_URL: use Render-injected RENDER_EXTERNAL_URL (full https URL) at runtime
