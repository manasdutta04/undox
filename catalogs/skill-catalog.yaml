# Discovery catalog for TrueForge Settings → Skills.
# Usage: SKILL_CATALOG_PATH=./catalogs/skill-catalog.yaml npx @truefoundry/trueforge
skills:
  - type: git
    name: spokeo
    url: https://github.com/manasdutta04/undox
    path: skills/brokers/spokeo
    ref: main
    description: Opt out of Spokeo people-search listings with human-approved submission.
  - type: git
    name: peoplefind
    url: https://github.com/manasdutta04/undox
    path: skills/brokers/peoplefind
    ref: main
    description: PeopleFind fixture broker for Undox Double-O demos.
  - type: git
    name: clearbook
    url: https://github.com/manasdutta04/undox
    path: skills/brokers/clearbook
    ref: main
    description: Clearbook fixture broker for Undox Double-O demos.
  - type: git
    name: exposure-score
    url: https://github.com/manasdutta04/undox
    path: skills/reporting/exposure-score
    ref: main
    description: Undox exposure / risk dashboard from session broker statuses.
