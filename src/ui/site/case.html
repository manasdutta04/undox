<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case — Undox Exposure</title>
  <link rel="stylesheet" href="/site/shared.css" />
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="/">Undox</a>
    <a href="/" data-nav>Home</a>
    <a href="/case" data-nav>Case</a>
    <a href="/brokers" data-nav>Brokers</a>
    <a href="/approval" data-nav>Approval</a>
    <a href="/harness" data-nav>Harness</a>
  </nav>
  <main class="main">
    <div class="session-bar">
      <div>
        <label for="session-input">Session</label><br />
        <input id="session-input" list="session-list" autocomplete="off" />
        <datalist id="session-list"></datalist>
      </div>
      <button type="button" class="btn btn-sm" id="session-go" style="align-self:flex-end">Load</button>
    </div>

    <div class="risk-block">
      <div class="risk-score low" id="risk-score">—</div>
      <div class="risk-bar"><i id="risk-bar" style="width:0%"></i></div>
      <p id="summary" class="empty" style="margin-top:0.75rem">Loading…</p>
    </div>

    <section class="grid-3" id="brokers"></section>

    <section class="card" style="margin-top:1.5rem">
      <h3 style="margin:0 0 0.75rem">Milestones</h3>
      <ul class="milestone-list" id="milestones"></ul>
    </section>

    <details class="timeline-compact">
      <summary>Full event log (last 6)</summary>
      <ol id="timeline"></ol>
    </details>

    <p class="footer-note" id="stamp"></p>
  </main>
  <script src="/site/shared.js"></script>
  <script>
    const U = window.UndoxSite;
    let lastSig = "";
    let pollTimer;
    let pollSeq = 0;

    async function refreshSessions() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        const list = document.getElementById("session-list");
        list.innerHTML = "";
        for (const id of data.sessions || []) {
          const opt = document.createElement("option");
          opt.value = id;
          list.appendChild(opt);
        }
      } catch (_) {}
    }

    function render(data) {
      const sig = JSON.stringify(data);
      if (sig === lastSig) return;
      lastSig = sig;

      const scoreEl = document.getElementById("risk-score");
      scoreEl.textContent = data.found ? String(data.riskScore ?? 0) : "—";
      scoreEl.className = "risk-score " + (data.riskLabel || "low");
      document.getElementById("risk-bar").style.width = Math.min(100, Number(data.riskScore) || 0) + "%";
      document.getElementById("summary").textContent = data.summary || "";

      const brokers = data.brokers || [];
      document.getElementById("brokers").innerHTML = brokers.length
        ? brokers.map((b) => {
            const listing = U.resolveUrl(b.profileUrl);
            return `<article class="card">
              <h3>${U.escapeHtml(b.broker)}</h3>
              ${U.statusBadge(b.status)}
              <p style="margin:0.75rem 0">
                ${listing ? `<a class="btn btn-sm btn-outline" href="${U.escapeHtml(listing)}" target="_blank" rel="noopener">View listing</a>` : ""}
                <a class="btn btn-sm" href="${U.withSession("/approval")}#${U.escapeHtml(b.broker)}">Approval preview</a>
              </p>
            </article>`;
          }).join("")
        : '<p class="empty">No brokers in this session.</p>';

      const ms = data.milestones || [];
      document.getElementById("milestones").innerHTML = ms.length
        ? ms.map((m) => `<li><span><strong>${U.escapeHtml(m.broker)}</strong> · ${U.escapeHtml(m.event.replace("broker.", ""))}</span><time>${U.formatTime(m.at)}</time></li>`).join("")
        : "<li class='empty'>No milestones yet</li>";

      const tl = data.timeline || [];
      document.getElementById("timeline").innerHTML = tl.length
        ? tl.map((e) => `<li>${U.formatTime(e.at)} — ${U.escapeHtml(e.event)}${e.detail ? " · " + U.escapeHtml(e.detail) : ""}</li>`).join("")
        : "<li>No events</li>";

      document.getElementById("stamp").textContent = "Updated " + new Date().toLocaleTimeString() + " · refreshes every 5s when this tab is open";
    }

    async function tick() {
      const id = U.sessionFromUrl();
      const seq = ++pollSeq;
      try {
        const data = await U.fetchSession();
        if (seq !== pollSeq || id !== U.sessionFromUrl()) return;
        render(data);
      } catch (e) {
        console.error(e);
      }
    }

    function start() {
      clearInterval(pollTimer);
      lastSig = "";
      pollSeq++;
      tick();
      pollTimer = setInterval(tick, 5000);
    }

    U.wireSessionBar(start);
    refreshSessions();
    start();
  </script>
</body>
</html>
