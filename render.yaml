services:
  - type: web
    name: undox-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: UNDOX_SESSION_STORE
        value: /data/.undox-session-state.json
      - key: UNDOX_MCP_TOKEN
        generateValue: true
      - key: UNDOX_PUBLIC_URL
        fromService:
          type: web
          name: undox-demo
          property: host
