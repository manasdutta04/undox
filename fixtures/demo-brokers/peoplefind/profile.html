<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PeopleFind profile (fixture)</title>

    .badge { background: #c45c26; color: #fff; padding: 0.2rem 0.5rem; font-size: 0.75rem; }
  </style>
</head>
<body>

</html>
