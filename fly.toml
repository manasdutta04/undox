# fly.toml app configuration file generated for undox
app = 'undox-demo'
primary_region = 'iad'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  UNDOX_SESSION_STORE = '/data/.undox-session-state.json'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'undox_data'
  destination = '/data'
